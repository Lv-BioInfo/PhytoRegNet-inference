[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phytoregnet"
version = "0.1.0"
description = "Minimal PhytoRegNet DNA sequence-to-accessibility inference"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "lvtongxuan", email = "lvtongxuan@genomics.cn"}]
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.24,<2", "torch>=2.6,<3"]
keywords = ["plant", "DNA", "chromatin accessibility", "sequence prediction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Repository = "https://github.com/Lv-BioInfo/PhytoRegNet-inference"

[project.scripts]
phytoregnet-predict = "phytoregnet_minimal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phytoregnet_minimal = ["configs/*.json", "weights/*/*.pt", "weights/manifest.json", "data/*.fa"]
